name: Build and deploy to IONOS VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Grant execute permission for gradlew
        run: chmod +x springbootserver/demo/gradlew

      - name: Build with Gradle
        run: cd springbootserver/demo && ./gradlew build -x test

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "springbootserver/demo/build/libs/demo-0.0.1-SNAPSHOT.jar"
          target: "/home/app/"
          strip_components: 4

      - name: Restart Spring Boot
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            pkill -f 'demo-0.0.1-SNAPSHOT.jar' || true
            nohup java -jar /home/app/demo-0.0.1-SNAPSHOT.jar --spring.datasource.url=${{ secrets.SPRING_DATASOURCE_URL }} --spring.datasource.username=${{ secrets.SPRING_DATASOURCE_USERNAME }} --spring.datasource.password=${{ secrets.SPRING_DATASOURCE_PASSWORD }} > /home/app/app.log 2>&1 &